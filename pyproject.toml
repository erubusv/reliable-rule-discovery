[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crbstpp"
version = "0.1.0"
description = "Certified rule-block-splicing temporal point processes"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6",
]

[project.optional-dependencies]
gpu = ["torch>=2.1"]
test = ["pytest>=7"]

[project.scripts]
crbstpp = "crbstpp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["crbstpp*"]

[tool.pytest.ini_options]
testpaths = ["tests/crbstpp"]
addopts = "-q"

